<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استيراد SOP/SIP من إكسيل</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<style>
  /* الحاجات اللي مش موجودة أصلاً في style.css بتاعك */
  .zones-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .zone-chip{
    border:1px solid var(--blueprint-line, #ccc); border-radius:20px; padding:6px 14px;
    font-size:12.5px; cursor:pointer; user-select:none; background:#fff;
  }
  .zone-chip.on{ background:var(--amber, #e0912a); border-color:var(--amber-dark, #b5730f); }
  .step-card{ border-inline-start:3px solid var(--amber, #e0912a); }
  .step-card.pre, .step-card.post{ border-inline-start-color:#888; }
  .photos-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .photo-thumb{ width:84px; height:84px; border-radius:6px; overflow:hidden; border:1px solid #ddd; }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .unassigned-grid{ display:flex; flex-wrap:wrap; gap:10px; }
  .unassigned-item{ text-align:center; font-size:11px; }
  .unassigned-item img{ width:90px; height:90px; object-fit:cover; border-radius:6px; border:1px solid #ddd; }
  .unassigned-item select{ display:block; margin-top:4px; width:96px; font-size:11px; }
  .dropzone{
    border:2px dashed #bbb; border-radius:10px; padding:36px; text-align:center;
    cursor:pointer; color:#777; margin-bottom:18px;
  }
  .dropzone.drag{ background:#fdf6e6; border-color:var(--amber, #e0912a); }
  .warn-box{ background:#fef3c7; color:#92400e; border:1px solid #f5d99b; border-radius:8px; padding:12px 14px; font-size:13px; margin-bottom:16px; }
  .gate-box{ max-width:420px; margin:80px auto; text-align:center; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">استيراد SOP/SIP من إكسيل</div>
  <nav><a href="index.html">⟵ رجوع للنظام</a></nav>
</div>

<div id="gate" class="gate-box"></div>
<div id="app-body" style="display:none; max-width:900px; margin:24px auto; padding:0 16px;"></div>

<script>
/* ============ تقسيمة مناطق الثلاجة ============ */
const ZONES = [
  {id:'DU', name:'الباب العلوي'}, {id:'DL', name:'الباب السفلي'},
  {id:'SLU', name:'الجانب الشمال العلوي'}, {id:'SLL', name:'الجانب الشمال السفلي'},
  {id:'SRU', name:'الجانب اليمين العلوي'}, {id:'SRL', name:'الجانب اليمين السفلي'},
  {id:'BKU', name:'الظهر العلوي'}, {id:'BKL', name:'الظهر السفلي ومنطقة الكباس'},
  {id:'TOP', name:'أعلى الثلاجة'},
  {id:'FRZ', name:'داخل الفريزر'}, {id:'CAB', name:'داخل الكبينة'}, {id:'PRE', name:'قبل الحقن'},
];

const HEADER_KEYWORDS = {
  step: ['الخطوات','steps'], content: ['محتوى','content'], tools: ['العدة','tools'],
  standard: ['الفحص القياس','standard inspection'], requirements: ['متطلبات','requirements'],
  photos: ['الصور','photos'],
};
const PRE_KEYWORDS  = ['قبل العمل','قبل الفحص'];
const POST_KEYWORDS = ['بعد العمل','بعد الفحص'];
const STOP_KEYWORDS = ['st','نموذج مؤهل'];

let selectedZones = new Set();
let parsedData = null;

/* ============ 1) بوابة الدخول: لازم تكون مسجل دخول وعندك صلاحية تعديل ============ */
async function boot(){
  await Auth.init();
  const gate = document.getElementById('gate');
  const body = document.getElementById('app-body');

  if (!Auth.isLoggedIn()){
    gate.innerHTML = `
      <h2>لازم تسجّل دخول الأول</h2>
      <p class="hint">افتح <a href="index.html">الصفحة الرئيسية للنظام</a> وسجّل دخولك، وارجع للصفحة دي تاني.</p>`;
    return;
  }
  if (!Auth.canEdit()){
    gate.innerHTML = `
      <h2>مالكش صلاحية إضافة SOPs</h2>
      <p class="hint">حسابك حاليًا "${esc(Auth.profile?.role || 'viewer')}". محتاج صلاحية مهندس/أدمن.</p>`;
    return;
  }
  gate.style.display = 'none';
  body.style.display = 'block';
  renderImporter(body);
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ 2) شكل الصفحة ============ */
function renderImporter(root){
  root.innerHTML = `
    <p class="hint" style="margin:10px 0 18px;">ارفع ملف إكسيل من نفس تمبلت الـ SIP. البرنامج هيكتشف الخطوات تلقائي (مهما اختلف عددها) ويسحب الصور المربوطة صح بكل خطوة.</p>
    <div class="dropzone" id="dropzone">اسحب ملف الإكسيل هنا أو دوس علشان تختاره<input type="file" id="fileInput" accept=".xlsx" style="display:none;"></div>
    <p class="hint" id="status"></p>
    <div id="resultArea" style="display:none;"></div>
  `;
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  dropzone.onclick = () => fileInput.click();
  dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add('drag'); };
  dropzone.ondragleave = () => dropzone.classList.remove('drag');
  dropzone.ondrop = e => { e.preventDefault(); dropzone.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
  fileInput.onchange = () => { if(fileInput.files[0]) handleFile(fileInput.files[0]); };
}

function setStatus(msg){ document.getElementById('status').textContent = msg; }

async function handleFile(file){
  setStatus('بيقرأ الملف...');
  try{
    const zip = await JSZip.loadAsync(file);
    parsedData = await parseWorkbook(zip);
    renderForm();
    setStatus(`تم التحليل: ${parsedData.steps.length} خطوة، ` +
      `${parsedData.steps.reduce((n,s)=>n+s.photos.length,0)} صورة مربوطة تلقائي، ` +
      `${parsedData.unassignedPhotos.length} صورة محتاجة مراجعة.`);
  }catch(err){
    console.error(err);
    setStatus('حصل خطأ في قراءة الملف: ' + err.message);
  }
}

/* ============ 3) قراءة الإكسيل (نفس المنطق اللي جرّبناه على الملف الحقيقي) ============ */
function colToIndex(col){ let n=0; for(let i=0;i<col.length;i++) n=n*26+(col.charCodeAt(i)-64); return n-1; }
function splitRef(ref){ const m=ref.match(/^([A-Z]+)(\d+)$/); return {col:colToIndex(m[1]), row:parseInt(m[2],10)}; }

async function parseWorkbook(zip){
  const parser = new DOMParser();
  const xml = path => zip.file(path).async('string').then(t => parser.parseFromString(t,'application/xml'));

  const wbDoc = await xml('xl/workbook.xml');
  const firstSheetRid = wbDoc.getElementsByTagName('sheet')[0].getAttribute('r:id');
  const wbRelsDoc = await xml('xl/_rels/workbook.xml.rels');
  let sheetPath = 'xl/worksheets/sheet1.xml';
  for(const rel of wbRelsDoc.getElementsByTagName('Relationship')){
    if(rel.getAttribute('Id') === firstSheetRid) sheetPath = 'xl/' + rel.getAttribute('Target').replace(/^\.?\/?/, '');
  }

  let sharedStrings = [];
  if(zip.file('xl/sharedStrings.xml')){
    const ssDoc = await xml('xl/sharedStrings.xml');
    sharedStrings = Array.from(ssDoc.getElementsByTagName('si')).map(si =>
      Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join(''));
  }

  const sheetDoc = await xml(sheetPath);
  const grid = {};
  for(const rowEl of sheetDoc.getElementsByTagName('row')){
    for(const cEl of rowEl.getElementsByTagName('c')){
      const ref = cEl.getAttribute('r'); if(!ref) continue;
      const {col,row} = splitRef(ref);
      const t = cEl.getAttribute('t');
      let val = '';
      if(t === 's'){ const v=cEl.getElementsByTagName('v')[0]; if(v) val = sharedStrings[parseInt(v.textContent,10)] || ''; }
      else if(t === 'inlineStr'){ const isEl=cEl.getElementsByTagName('is')[0]; if(isEl) val = Array.from(isEl.getElementsByTagName('t')).map(t=>t.textContent).join(''); }
      else{ const v=cEl.getElementsByTagName('v')[0]; if(v) val = v.textContent; }
      if(val) grid[row+','+col] = val.trim();
    }
  }

  const merges = {};
  for(const mc of sheetDoc.getElementsByTagName('mergeCell')){
    const [a,b] = mc.getAttribute('ref').split(':');
    const start = splitRef(a), end = splitRef(b);
    merges[start.row+','+start.col] = end;
  }

  let images = [];
  let mediaByRid = {};
  const sheetRelsPath = sheetPath.replace('worksheets/', 'worksheets/_rels/') + '.rels';
  if(zip.file(sheetRelsPath)){
    const sheetRelsDoc = await xml(sheetRelsPath);
    let drawingPath = null;
    const drawingTag = sheetDoc.getElementsByTagName('drawing')[0];
    if(drawingTag){
      const drId = drawingTag.getAttribute('r:id');
      for(const rel of sheetRelsDoc.getElementsByTagName('Relationship')){
        if(rel.getAttribute('Id') === drId) drawingPath = 'xl/' + rel.getAttribute('Target').replace(/^\.?\/?/, '');
      }
    }
    if(drawingPath && zip.file(drawingPath)){
      const drDoc = await xml(drawingPath);
      const drRelsPath = drawingPath.replace('drawings/', 'drawings/_rels/') + '.rels';
      const drRelsDoc = zip.file(drRelsPath) ? await xml(drRelsPath) : null;
      const ridToTarget = {};
      if(drRelsDoc) for(const rel of drRelsDoc.getElementsByTagName('Relationship'))
        ridToTarget[rel.getAttribute('Id')] = 'xl/' + rel.getAttribute('Target').replace(/^\.?\/?/, '');
      for(const rid in ridToTarget){
        const path = ridToTarget[rid];
        if(zip.file(path)){
          const blob = await zip.file(path).async('blob');
          const ext = (path.split('.').pop() || 'jpg').toLowerCase();
          mediaByRid[rid] = { blob, url: URL.createObjectURL(blob), ext };
        }
      }
      for(const a of drDoc.getElementsByTagName('xdr:oneCellAnchor')){
        const rowEl = a.getElementsByTagName('xdr:from')[0].getElementsByTagName('xdr:row')[0];
        const blip = a.getElementsByTagName('a:blip')[0];
        if(!rowEl || !blip) continue;
        const row0 = parseInt(rowEl.textContent,10);
        images.push({row0, rowEnd0:row0, rid: blip.getAttribute('r:embed')});
      }
      for(const a of drDoc.getElementsByTagName('xdr:twoCellAnchor')){
        const fromRow = a.getElementsByTagName('xdr:from')[0].getElementsByTagName('xdr:row')[0];
        const toRow = a.getElementsByTagName('xdr:to')[0]?.getElementsByTagName('xdr:row')[0];
        const blip = a.getElementsByTagName('a:blip')[0];
        if(!fromRow || !blip) continue;
        const row0 = parseInt(fromRow.textContent,10);
        images.push({row0, rowEnd0: toRow?parseInt(toRow.textContent,10):row0, rid: blip.getAttribute('r:embed')});
      }
    }
  }

  let maxRow=0, maxCol=0;
  for(const key in grid){ const [r,c]=key.split(',').map(Number); if(r>maxRow)maxRow=r; if(c>maxCol)maxCol=c; }
  const cell = (r,c) => grid[r+','+c] || '';

  let headerRow=-1, colMap={};
  for(let r=1;r<=maxRow;r++){
    let found={};
    for(let c=0;c<=maxCol;c++){
      const txt = cell(r,c).toLowerCase(); if(!txt) continue;
      for(const field in HEADER_KEYWORDS) if(HEADER_KEYWORDS[field].some(k=>txt.includes(k))) found[field]=c;
    }
    if(Object.keys(found).length>=3){ headerRow=r; colMap=found; break; }
  }
  if(headerRow===-1) throw new Error('معرفتش ألاقي صف الهيدر (Steps/Content/Tools...) في الملف ده');

  let title='', preWorkText='', postWorkText='';
  for(let r=1;r<headerRow;r++)
    for(let c=0;c<=maxCol;c++){
      const txt = cell(r,c); if(!txt) continue;
      if(txt.length > title.length && !txt.includes('اعداد') && !txt.includes('اعتماد') && !txt.includes('توقيع') && !/^no\.?\s*\d+/i.test(txt) && !/^ver\.?/i.test(txt)) title = txt;
    }

  const steps = [];
  const stepCol = colMap.step;
  for(let r=headerRow+1; r<=maxRow; r++){
    const label = cell(r, stepCol);
    if(!label) continue;
    const low = label.toLowerCase().trim();
    if(STOP_KEYWORDS.some(k => low===k || low.includes(k))) break;

    const rowEnd = merges[r+','+stepCol] ? merges[r+','+stepCol].row : r;
    const contentTxt = cell(r, colMap.content) || '';
    const toolsTxt = cell(r, colMap.tools) || '';
    const standardTxt = cell(r, colMap.standard) || '';
    const reqTxt = cell(r, colMap.requirements) || '';

    if(PRE_KEYWORDS.some(k => label.includes(k))){
      preWorkText = [toolsTxt, standardTxt, reqTxt].filter(Boolean).join('\n');
      continue;
    }
    if(POST_KEYWORDS.some(k => label.includes(k))){
      postWorkText = [toolsTxt, standardTxt, reqTxt].filter(Boolean).join('\n');
      break;
    }

    steps.push({
      titleAr: contentTxt || label,               // -> steps.title_ar
      tools: toolsTxt.split(/\n|,|،/).map(s=>s.trim()).filter(Boolean), // -> steps.requirements (array)
      standard: standardTxt,                       // -> steps.accept_criteria
      requirements: reqTxt,                        // -> steps.description
      rowStart: r, rowEnd,
      photos: [],
    });
  }

  const unassignedPhotos = [];
  for(const img of images){
    const anchorRow1 = img.row0 + 1;
    const media = mediaByRid[img.rid];
    if(!media) continue;
    const step = steps.find(s => anchorRow1 >= s.rowStart && anchorRow1 <= s.rowEnd);
    const entry = { blob: media.blob, url: media.url, ext: media.ext, anchorRow: anchorRow1 };
    if(step) step.photos.push(entry); else unassignedPhotos.push(entry);
  }

  return { title, preWorkText, postWorkText, steps, unassignedPhotos };
}

/* ============ 4) الفورم بعد التحليل ============ */
function renderForm(){
  const area = document.getElementById('resultArea');
  area.style.display = 'block';
  area.innerHTML = `
    <div class="form-card">
      <h2>بيانات SOP الأساسية</h2>
      <div class="field-row">
        <div class="field"><label>العنوان (عربي)</label><input id="m-title" value="${esc(parsedData.title)}"></div>
        <div class="field"><label>المصنع</label><input id="m-factory" placeholder="مثال: مصنع سادات سيتي"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>الخط</label><input id="m-station" placeholder="مثال: التجميع النهائي"></div>
        <div class="field" style="max-width:150px;"><label>رقم المحطة على الخط</label><input id="m-station-no" type="number" min="1" placeholder="مثال: 1"></div>
      </div>
      <div class="field"><label>إجراء قبل العمل</label><textarea id="m-pre">${esc(parsedData.preWorkText)}</textarea></div>
      <div class="field"><label>إجراء بعد انتهاء العمل</label><textarea id="m-post">${esc(parsedData.postWorkText)}</textarea></div>
      <div class="field"><label>الموقع/المواقع في الثلاجة</label>
        <div class="zones-grid" id="zonesGrid"></div>
      </div>
    </div>
    <div id="warnBox"></div>
    <div id="stepsArea"></div>
    <div class="form-card" id="unassignedCard" style="display:none;">
      <h2>صور محتاجة مراجعة (مش مربوطة بخطوة معينة في الملف الأصلي)</h2>
      <p class="hint" style="margin-bottom:12px;">حدد لكل صورة الخطوة المناسبة، أو سيبها من غير تحديد لو مش لازمة.</p>
      <div class="unassigned-grid" id="unassignedGrid"></div>
    </div>
    <button class="btn btn-primary" id="importBtn">📥 استيراد إلى النظام</button>
    <p class="hint" id="importStatus" style="margin-top:8px;"></p>
  `;

  renderZoneChips();

  const warnBox = document.getElementById('warnBox');
  if(parsedData.unassignedPhotos.length){
    warnBox.innerHTML = `<div class="warn-box">فيه ${parsedData.unassignedPhotos.length} صورة في الملف مش مربوطة بخطوة معينة. راجعها تحت وحدد الخطوة المناسبة لكل واحدة.</div>`;
  }

  const stepsArea = document.getElementById('stepsArea');
  stepsArea.innerHTML = '';
  parsedData.steps.forEach((s,i) => {
    const card = document.createElement('div');
    card.className = 'form-card step-card';
    card.innerHTML = `
      <h2>خطوة ${i+1}</h2>
      <div class="field"><label>الخطوة (محتوى الفحص)</label><textarea data-i="${i}" data-f="titleAr">${esc(s.titleAr)}</textarea></div>
      <div class="field-row">
        <div class="field"><label>المعدات والآلات (سطر لكل عنصر)</label><textarea data-i="${i}" data-f="toolsText">${esc(s.tools.join('\n'))}</textarea></div>
        <div class="field"><label>الفحص القياسي</label><textarea data-i="${i}" data-f="standard">${esc(s.standard)}</textarea></div>
      </div>
      <div class="field"><label>متطلبات العمل</label><textarea data-i="${i}" data-f="requirements">${esc(s.requirements)}</textarea></div>
      <label class="hint">الصور المسحوبة تلقائي (${s.photos.length})</label>
      <div class="photos-row">${
        s.photos.length ? s.photos.map(p=>`<div class="photo-thumb"><img src="${p.url}"></div>`).join('')
                        : '<span class="hint">مفيش صور مربوطة تلقائي بالخطوة دي</span>'
      }</div>
    `;
    stepsArea.appendChild(card);
  });
  stepsArea.querySelectorAll('textarea').forEach(el => {
    el.oninput = () => {
      const s = parsedData.steps[el.dataset.i];
      if(el.dataset.f === 'toolsText') s.tools = el.value.split('\n').map(x=>x.trim()).filter(Boolean);
      else s[el.dataset.f] = el.value;
    };
  });

  const unassignedCard = document.getElementById('unassignedCard');
  const grid = document.getElementById('unassignedGrid');
  if(parsedData.unassignedPhotos.length){
    unassignedCard.style.display = 'block';
    grid.innerHTML = '';
    parsedData.unassignedPhotos.forEach((p,i) => {
      const opts = ['<option value="">-- اختر خطوة --</option>']
        .concat(parsedData.steps.map((s,si)=>`<option value="${si}">خطوة ${si+1}: ${esc(s.titleAr).slice(0,20)}</option>`));
      const item = document.createElement('div');
      item.className = 'unassigned-item';
      item.innerHTML = `<img src="${p.url}"><select data-u="${i}">${opts.join('')}</select>`;
      grid.appendChild(item);
    });
    grid.querySelectorAll('select').forEach(el => {
      el.onchange = () => { if(el.value!=='') parsedData.steps[el.value].photos.push(parsedData.unassignedPhotos[el.dataset.u]); };
    });
  }

  document.getElementById('importBtn').onclick = doImport;
}

function renderZoneChips(){
  const grid = document.getElementById('zonesGrid');
  grid.innerHTML = '';
  ZONES.forEach(z => {
    const chip = document.createElement('div');
    chip.className = 'zone-chip' + (selectedZones.has(z.id) ? ' on' : '');
    chip.textContent = z.name;
    chip.onclick = () => { selectedZones.has(z.id) ? selectedZones.delete(z.id) : selectedZones.add(z.id); renderZoneChips(); };
    grid.appendChild(chip);
  });
}

/* ============ 5) الاستيراد الفعلي عن طريق نفس DB.* اللي بيستخدمها باقي النظام ============ */
async function doImport(){
  const btn = document.getElementById('importBtn');
  const statusEl = document.getElementById('importStatus');
  btn.disabled = true;

  const titleAr = document.getElementById('m-title').value.trim();
  const factory = document.getElementById('m-factory').value.trim();
  const station = document.getElementById('m-station').value.trim();
  const stationNoRaw = document.getElementById('m-station-no').value.trim();

  if(!titleAr || !station || !stationNoRaw){
    statusEl.textContent = 'محتاج تملأ: العنوان، الخط، ورقم المحطة الأول.';
    btn.disabled = false;
    return;
  }

  try{
    statusEl.textContent = 'بيعمل SOP جديد...';
    const sop = await DB.createSop({
      doc_type: 'SIP',
      title_ar: titleAr,
      title: titleAr,
      factory: factory || null,
      station,
      station_no: Number(stationNoRaw),
      status: 'draft',
      zones: Array.from(selectedZones),
      pre_work_procedure: document.getElementById('m-pre').value.trim() || null,
      post_work_procedure: document.getElementById('m-post').value.trim() || null,
    });

    statusEl.textContent = 'بيولّد كود المستند...';
    try{ await DB.generateSopCode(sop.id, station, 'SIP'); }catch(e){ console.warn('generateSopCode failed:', e.message); }

    statusEl.textContent = 'بيضيف الخطوات...';
    const stage = await DB.createStage(sop.id, { title: 'خطوات', title_ar: 'خطوات' }, 0);

    for(let i=0;i<parsedData.steps.length;i++){
      const s = parsedData.steps[i];
      statusEl.textContent = `بيضيف خطوة ${i+1} من ${parsedData.steps.length}...`;
      const createdStep = await DB.createStep(stage.id, {
        title_ar: s.titleAr,
        title: s.titleAr,
        requirements: s.tools,
        accept_criteria: s.standard || null,
        description: s.requirements || null,
      }, i);

      for(let pi=0; pi<s.photos.length; pi++){
        const p = s.photos[pi];
        const file = new File([p.blob], `photo-${pi}.${p.ext}`, { type: p.blob.type || 'image/jpeg' });
        statusEl.textContent = `بيرفع صور خطوة ${i+1} (${pi+1}/${s.photos.length})...`;
        await DB.uploadStepImage(createdStep.id, file, pi);
      }
    }

    statusEl.innerHTML = `تم الاستيراد بنجاح ✅ — <a href="index.html#/sop/${sop.id}/edit">افتح الـ SOP للمراجعة والتعديل</a>`;
    btn.style.display = 'none';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'حصل خطأ أثناء الاستيراد: ' + err.message;
    btn.disabled = false;
  }
}

boot();
</script>
</body>
</html>
